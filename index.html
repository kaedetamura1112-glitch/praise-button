<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>褒めボタン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+HarunoUmi:wght@700&family=Noto+Sans+JP:wght@400,900&family=Potta+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #faf7f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 6px;
      color: #aaa;
      margin-top: 52px;
    }

    #praise-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: #F45B69;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 10px 36px rgba(244, 91, 105, 0.45);
      transition: background-color 0.5s ease, box-shadow 0.5s ease, transform 0.1s ease;
    }

    #praise-btn:hover { filter: brightness(1.06); }
    #praise-btn:active { transform: scale(0.92); }

    #message {
      margin-bottom: 52px;
      width: 360px;
      min-height: 3.6em;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.7;
      text-align: center;
      white-space: pre-line;
      color: #F45B69;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.5s ease;
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="message"></div>
  <button id="praise-btn">押してね</button>
  <h1>褒めボタン</h1>
  <script src="praise.js"></script>
</body>
</html>
